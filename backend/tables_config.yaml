  asamblea_constituyente:
    pk: id_anc
    pk_label: "ID ANC"
    label: "Asamblea Nacional Constituyente"
    subfondo_cod: ANC

  ahl_ia:
    pk: id_ahl_ia
    pk_label: "ID AHL IA"
    label: "AHL IA"
    subfondo_cod: AHLIA

  ahl_manual:
    pk: id_ahl_manual
    pk_label: "ID AHL Manual"
    label: "AHL Manual"
    subfondo_cod: AHLM

  fondo_congreso:
    pk: id_fondo_congreso
    pk_label: "ID fondo congreso"
    label: "Fondo Congreso"
    subfondo_cod: FCON

  fondo_congresito:
    pk: id_fondo_congresito
    pk_label: "ID fondo congresito"
    label: "Fondo Congresito"
    subfondo_cod: FCG
