# Nombre fijo del proyecto: evita volúmenes distintos al renombrar la carpeta.
name: archivo-congreso

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Volumen nombrado explícito: los datos sobreviven a restart/stop (no usar down -v).
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/document_tables.sql:/docker-entrypoint-initdb.d/02-document_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - exports_data:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-keep-alive 600 --limit-max-requests 10000 --h11-max-incomplete-event-size 104857600

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    environment:
      # En despliegue externo, usar URL pública del backend (terminando en /api).
      # En local puede quedar vacío y usar proxy de Vite.
      - VITE_API_URL=${VITE_API_URL:-}

volumes:
  pgdata:
    name: archivo_congreso_pgdata
  uploads:
    name: archivo_congreso_uploads
  exports_data:
    name: archivo_congreso_exports
